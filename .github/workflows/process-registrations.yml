name: 活動報名自動配對 — 每小時補活動關聯與客戶配對

on:
  # 台灣時間 08:00–22:00 每小時（UTC 00–14）；外掛表單報名與展會簽到在一小時內進入拜訪建議
  schedule:
    - cron: '5 0-14 * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: 觸發正式站配對端點
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORT_SECRET }}
        run: |
          # 每天第一輪（台灣 08:05）重試先前未配對者（例如之後才匯入客戶庫的新機構），其餘各輪只處理新報名
          retry=0; [ "$(date -u +%H)" = "00" ] && retry=1
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://songtah-quote.vercel.app/api/cron/process-registrations?retry=${retry}" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/resp.json
          test "$code" = "200"
