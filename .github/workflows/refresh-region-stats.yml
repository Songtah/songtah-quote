name: 區域客戶統計 — 每晚重算保持快取新鮮

on:
  # 每天 21:00 UTC(台灣時間 05:00)重算,上班前快取已 warm
  schedule:
    - cron: '0 21 * * *'
  workflow_dispatch:   # 允許手動觸發

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 觸發正式站重算端點
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORT_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://songtah-quote.vercel.app/api/cron/refresh-region-stats" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/resp.json
          test "$code" = "200"

      - name: 追蹤名單成交自動判定
        # 各步驟彼此獨立：一步遇到 Notion 逾時不該讓後面的全部被跳過
        if: always()
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORT_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp2.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://songtah-quote.vercel.app/api/cron/campaign-autoclose" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/resp2.json
          test "$code" = "200"

      - name: 拜訪建議映射重算(最後拜訪日/設備/訂單)
        # 各步驟彼此獨立：一步遇到 Notion 逾時不該讓後面的全部被跳過
        if: always()
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORT_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp3.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://songtah-quote.vercel.app/api/cron/refresh-visit-suggestions" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/resp3.json
          test "$code" = "200"

      - name: 待認領建議重算(客情回報觸發認領的第二/三層)
        # 各步驟彼此獨立：一步遇到 Notion 逾時不該讓後面的全部被跳過
        if: always()
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORT_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp4.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://songtah-quote.vercel.app/api/cron/refresh-claim-suggestions" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/resp4.json
          test "$code" = "200"

      - name: 待追蹤自動結案(客戶已有更新拜訪 → 該筆後續已被取代)
        # 各步驟彼此獨立：一步遇到 Notion 逾時不該讓後面的全部被跳過
        if: always()
        env:
          CRON_SECRET: ${{ secrets.DAILY_REPORT_SECRET }}
        run: |
          code=$(curl -s -o /tmp/resp5.json -w "%{http_code}" \
            --max-time 300 \
            -X POST "https://songtah-quote.vercel.app/api/cron/close-stale-followups" \
            -H "x-cron-secret: ${CRON_SECRET}")
          echo "HTTP $code"; cat /tmp/resp5.json
          test "$code" = "200"
