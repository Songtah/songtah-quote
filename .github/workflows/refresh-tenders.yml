name: 標案機會 — 每日抓取政府採購網牙科標案

on:
  schedule:
    # 台灣時間 07:10、12:10、17:10（UTC 23:10 / 04:10 / 09:10）——增量掃描，當天新公告最多等 5 小時
    - cron: '10 23 * * *'
    - cron: '10 4 * * *'
    - cron: '10 9 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 重抓標案
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://songtah-quote.vercel.app/api/cron/refresh-tenders" \
            -H "x-cron-secret: ${{ secrets.DAILY_REPORT_SECRET }}")
          cat /tmp/out.json
          echo ""
          if [ "$code" != "200" ]; then echo "HTTP $code"; exit 1; fi
