name: 標案機會 — 每日抓取政府採購網牙科標案

on:
  schedule:
    # 台灣時間 08:10 起每兩小時到 20:10（UTC 00:10,02:10,…,12:10）——新公告最多等 2 小時
    - cron: '10 0,2,4,6,8,10,12 * * *'
    # 台灣時間 07:10（UTC 23:10）：每天第一輪，順便在每月 6 號補寫官方開放資料
    - cron: '10 23 * * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 重抓標案
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" -X POST \
            "https://songtah-quote.vercel.app/api/cron/refresh-tenders" \
            -H "x-cron-secret: ${{ secrets.DAILY_REPORT_SECRET }}")
          cat /tmp/out.json
          echo ""
          # 503＝掃不到公告或最新公告超過三天，視為失敗（GitHub 會寄通知）
          if [ "$code" != "200" ]; then echo "HTTP $code：標案抓取異常"; exit 1; fi

      - name: 每月 6 號補寫官方開放資料（可商用來源；落後約兩個月）
        if: ${{ github.event.schedule == '10 23 * * *' }}
        run: |
          if [ "$(date -u +%d)" = "06" ]; then
            curl -s -X POST "https://songtah-quote.vercel.app/api/cron/refresh-tenders?official=1&periods=6" \
              -H "x-cron-secret: ${{ secrets.DAILY_REPORT_SECRET }}" | head -c 500
            echo ""
          else
            echo "非每月 6 號，略過官方補寫"
          fi
